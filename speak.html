<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音合成測試</title>
<style>
  body {
    font-family: -apple-system, "PingFang TC", sans-serif;
    padding: 20px;
    line-height: 1.5;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 17px;
    padding: 10px;
    min-height: 80px;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    font-family: inherit;
    line-height: 1.5;
  }
  button {
    width: 100%;
    font-size: 17px;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #0071e3;
    color: #fff;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: 0.75; }
  button:disabled { background: #c7c7cc; }
  #status {
    font-size: 14px;
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: #e8e8ed;
    line-height: 1.4;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<textarea id="text">你好</textarea>
<button id="speakBtn">🔊 朗讀</button>
<div id="status">檢查語音中…</div>

<script>
const synth = window.speechSynthesis;
const statusEl = document.getElementById('status');
const speakBtn = document.getElementById('speakBtn');
const textEl = document.getElementById('text');

let voicesReady = false;
let zhVoice = null;

// 1. 等待語音列表就緒（iOS 的 getVoices() 是非同步載入的）
function loadVoices() {
  const voices = synth.getVoices();
  if (voices.length === 0) return;

  voicesReady = true;

  // 優先選中文語音
  zhVoice = voices.find(v => /zh[-_]?(TW|HK|CN)/i.test(v.lang))
         || voices.find(v => /^zh/i.test(v.lang));

  if (zhVoice) {
    statusEl.textContent = '✅ 語音就緒：' + zhVoice.name + ' (' + zhVoice.lang + ')';
  } else {
    statusEl.textContent = '⚠️ 未找到中文語音，將使用預設語音';
  }
}

// 監聽 voiceschanged，同時輪詢兜底（Safari 首次互動後才載入語音）
synth.onvoiceschanged = loadVoices;
loadVoices();

let pollCount = 0;
const poll = setInterval(() => {
  if (voicesReady || pollCount++ > 20) { clearInterval(poll); return; }
  loadVoices();
}, 250);

// 2. 朗讀
speakBtn.addEventListener('click', () => {
  synth.cancel(); // 清除阻塞佇列

  let text = textEl.value.trim();
  if (!text) { statusEl.textContent = '請輸入文字。'; return; }

  // 3. 規避 iOS 26+ 的凍結 Bug
  // 如果文本以 < 開頭、> 結尾，且包含中文字符，就替換掉尖括號
  if (text.startsWith('<') && text.endsWith('>') && /[\u4e00-\u9fff]/.test(text)) {
    text = text.replace(/[<>]/g, ch => ({ '<': '\uff1c', '>': '\uff1e' }[ch]));
    statusEl.textContent = '⚠️ 已自動替換尖括號以避開 iOS Bug';
  }

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = zhVoice ? zhVoice.lang : 'zh-TW';
  utter.rate = 1.0;
  utter.pitch = 1.0;
  utter.volume = 1.0;

  // 4. 關鍵：顯式指定 voice，否則 iOS 可能靜默失敗
  if (zhVoice) {
    utter.voice = zhVoice;
  } else {
    const allVoices = synth.getVoices();
    if (allVoices.length > 0) utter.voice = allVoices[0];
  }

  utter.onstart = () => { statusEl.textContent = '🔊 播放中…'; };
  utter.onend = () => { statusEl.textContent = '✅ 播放完畢。'; };
  utter.onerror = (e) => { statusEl.textContent = '❌ 錯誤：' + e.error; };

  synth.speak(utter);
});
</script>

</body>
</html>
